; SO-ARM Portal — PHP 設定
; 動画（MP4）や軌道データ（HDF5 / Parquet）を扱うため、標準より大きめにしてあります。
memory_limit = 512M
upload_max_filesize = 512M
post_max_size = 512M
max_file_uploads = 50
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
date.timezone = Asia/Tokyo

; 開発用: エラーを隠さない（本番では display_errors = Off にしてください）
display_errors = Off
log_errors = On
error_reporting = E_ALL

opcache.enable = 1
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
