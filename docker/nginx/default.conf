# SO-ARM Portal — Nginx 設定
# 静的ファイルは Nginx が直接返し、それ以外は Drupal（PHP-FPM）へ渡します。
server {
    listen 80;
    server_name _;
    root /opt/drupal/web;
    index index.php;

    # 動画（MP4）や軌道データ（HDF5 / Parquet）のアップロード用。php 側の上限と揃える。
    client_max_body_size 512M;

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { allow all; log_not_found off; access_log off; }

    # 隠しファイルと、外から見せてはいけないファイル
    location ~ (^|/)\. { return 403; }
    location ~ ^/sites/.*/private/ { return 403; }
    location ~ ^/sites/[^/]+/files/.*\.php$ { deny all; }
    location ~* \.(engine|inc|install|make|module|profile|po|sh|.*sql|theme|twig|tpl(\.php)?|xtmpl|yml)(~|\.sw[op]|\.bak|\.orig|\.save)?$ { return 404; }
    location ~ /vendor/.*\.php$ { deny all; return 404; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location @rewrite {
        rewrite ^ /index.php;
    }

    # 画像スタイル・CSS/JS の集約ファイルは、無ければ Drupal が生成する
    location ~ ^/sites/.*/files/(styles|css|js)/ {
        try_files $uri @rewrite;
    }

    # 非公開ファイルは必ず Drupal のアクセス制御を通す
    location ~ ^(/[a-z\-]+)?/system/files/ {
        try_files $uri /index.php?$query_string;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff2?|ttf|mp4|webm)$ {
        try_files $uri @rewrite;
        expires 7d;
        log_not_found off;
    }

    location ~ '\.php$|^/update.php' {
        fastcgi_split_path_info ^(.+?\.php)(|/.*)$;
        try_files $fastcgi_script_name =404;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_intercept_errors on;
        fastcgi_read_timeout 300;
        fastcgi_pass drupal:9000;
    }
}
