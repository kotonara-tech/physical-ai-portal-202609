# SO-ARM Portal の CI。
#
# Small と Medium の PHPUnit テスト、phpcs を回します。Large（tests/e2e/ の E2E と
# GUI）は稼働中のスタックに当てるテストなので、CI では回しません。
# テストは Dockerfile の app ステージのイメージの中で動かします（手元の
# workspace-drupal-1 と同じ PHP・vendor）。Kernel テストは SQLite を使うので、
# DB コンテナも compose も要りません。
#
# イメージは build ジョブで 1 回だけ作り、artifact で後のジョブに渡します。
# どのジョブも同じイメージでテストし、Medium は Small や phpcs の結果を待ちません。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR は新しい push で古い実行を止める。main は push ごとに別のグループにして、
  # どの push の結果も残す（同じグループだと、待機中の実行は新しい実行に取り消される）
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # -eo pipefail が付く。パイプの途中の失敗も落とす
    shell: bash

env:
  IMAGE: soarm-app:ci

jobs:
  build:
    name: Build the app image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      medium-modules: ${{ steps.modules.outputs.list }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build and export
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/soarm-app.tar
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: soarm-app
          path: ${{ runner.temp }}/soarm-app.tar
          retention-days: 1

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: List the modules that have Medium tests
        id: modules
        run: |
          listed=$(docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --list-tests --group medium)
          list=$(sed -nE 's/^ - Drupal\\Tests\\([a-z0-9_]+)\\.*/\1/p' <<<"$listed" | sort -u | jq -R . | jq -cs .)
          echo "Modules: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  checks:
    # 3 つのステップは互いに独立。1 つが落ちても残りは流す（!cancelled()）
    name: Sizes, Small tests, phpcs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: soarm-app
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: Every test is Small or Medium
        run: |
          listed=$(docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --list-tests --exclude-group small,medium)
          unsized=$(grep '^ - ' <<<"$listed" || true)
          if [ -n "$unsized" ]; then
            echo "::error::PHPUnit tests need #[Small] or #[Medium]. Large tests live in tests/e2e/ (see CLAUDE.md, test sizes):"
            echo "$unsized"
            exit 1
          fi

      - name: Small tests
        if: ${{ !cancelled() }}
        run: docker run --rm -u www-data "$IMAGE" vendor/bin/phpunit -c phpunit.xml --group small

      - name: phpcs
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpcs --standard=Drupal,DrupalPractice web/modules/custom

  medium:
    # Kernel テストはテストメソッドごとに Drupal をインストールするので遅い。
    # モジュールごとに別のジョブにして並列で回す。
    # Functional（BrowserTestBase）は nginx が要るので、このジョブでは動かない。
    # 最初の Functional テストと一緒に compose を使うジョブを足す（docs/plan.md）。
    name: Medium tests (${{ matrix.module }})
    needs: build
    if: ${{ needs.build.outputs.medium-modules != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.medium-modules) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: soarm-app
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: Medium tests
        env:
          MODULE: ${{ matrix.module }}
        run: |
          docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --group medium "web/modules/custom/$MODULE"
