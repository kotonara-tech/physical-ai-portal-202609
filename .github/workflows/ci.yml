# SO-ARM Portal の CI。
#
# Small と Medium の PHPUnit テスト、phpcs を回します。Large（tests/e2e/ の E2E と
# GUI）は稼働中のスタックに当てるテストなので、CI では回しません。
# テストは Dockerfile の app ステージのイメージの中で動かします（手元の
# workspace-drupal-1 と同じ Dockerfile と composer.lock。ベースの drupal:11-fpm は
# 動くタグなので、PHP のパッチ版は build した時期でずれうる）。Kernel テストは SQLite を使うので、
# DB コンテナも compose も要りません。
#
# イメージは build ジョブで 1 回だけ作り、artifact で後のジョブに渡します。
# どのジョブも同じイメージでテストし、Medium は Small や phpcs の結果を待ちません。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR は新しい push で古い実行を止める。main は push ごとに別のグループにして、
  # どの push の結果も残す（同じグループだと、待機中の実行は新しい実行に取り消される）
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # -eo pipefail が付く。パイプの途中の失敗も落とす
    shell: bash

env:
  IMAGE: soarm-app:ci

jobs:
  build:
    name: Build the app image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      medium-modules: ${{ steps.modules.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップは git を使わない。トークンを .git/config に残さない
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and export
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: app
          tags: ${{ env.IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/soarm-app.tar
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

      - name: Upload the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: soarm-app
          path: ${{ runner.temp }}/soarm-app.tar
          retention-days: 1
          # レイヤーは圧縮済みなので、zip で圧縮し直さない
          compression-level: 0

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: List the modules that have Medium tests
        id: modules
        run: |
          listed=$(docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --list-tests --group medium)
          # 名前空間からモジュールが取れないテストは、どの Medium のジョブにも入らない。
          # 黙って漏らさずに落とす
          outside=$(grep '^ - ' <<<"$listed" | grep -v -E '^ - Drupal\\Tests\\[a-z0-9_]+\\.' || true)
          if [ -n "$outside" ]; then
            echo "::error::Medium tests must be in the Drupal\\Tests\\<module>\\ namespace, or no job runs them:"
            echo "$outside"
            exit 1
          fi
          list=$(sed -nE 's/^ - Drupal\\Tests\\([a-z0-9_]+)\\.*/\1/p' <<<"$listed" | sort -u | jq -R . | jq -cs .)
          echo "Modules: $list"
          # 空なら一覧の取り方が壊れている。黙って Medium を飛ばさずに落とす
          if [ "$list" = "[]" ]; then
            echo "::error::No module with Medium tests was found."
            exit 1
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"

  checks:
    # 3 つのテストのステップは互いに独立。1 つが落ちても残りは流す。
    # イメージを読み込めなかった時は、どれも流さない
    name: Sizes, Small tests, phpcs
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soarm-app
          path: ${{ runner.temp }}

      - name: Load the image
        id: load
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: Every test is Small or Medium
        run: |
          listed=$(docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --list-tests --exclude-group small --exclude-group medium)
          unsized=$(grep '^ - ' <<<"$listed" || true)
          if [ -n "$unsized" ]; then
            echo "::error::PHPUnit tests need #[Small] or #[Medium]. Large tests live in tests/e2e/ (see CLAUDE.md, test sizes):"
            echo "$unsized"
            exit 1
          fi

      - name: Small tests
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: docker run --rm -u www-data "$IMAGE" vendor/bin/phpunit -c phpunit.xml --group small --fail-on-empty-test-suite

      - name: phpcs
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        run: |
          docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpcs --standard=Drupal,DrupalPractice web/modules/custom

  medium:
    # Kernel テストはテストメソッドごとに Drupal をインストールするので遅い。
    # モジュールごとに別のジョブにして並列で回す。
    # Functional（BrowserTestBase）も #[Medium] なのでこのジョブに来るが、nginx が無いので落ちる。
    # 最初の Functional テストと一緒に、compose を使うジョブを足して Functional をそちらへ移す
    # （docs/plan.md）。黙って飛ばすより、落ちて気づくほうを選んでいる。
    name: Medium tests (${{ matrix.module }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.build.outputs.medium-modules) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: soarm-app
          path: ${{ runner.temp }}

      - name: Load the image
        run: docker load --input "$RUNNER_TEMP/soarm-app.tar"

      - name: Medium tests
        env:
          MODULE: ${{ matrix.module }}
        # 一覧と同じく、phpunit.xml の testsuite と名前空間で選ぶ。パスで選ぶと、
        # 名前空間とフォルダが食い違うテストが一覧と実行のどちらかから漏れる
        run: |
          docker run --rm -u www-data "$IMAGE" \
            vendor/bin/phpunit -c phpunit.xml --group medium --fail-on-empty-test-suite --filter "^Drupal\\\\Tests\\\\${MODULE}\\\\"
