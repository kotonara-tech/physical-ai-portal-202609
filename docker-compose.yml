# SO-ARM Portal — ローカル Docker 構成
#
#   nginx (web) --FastCGI--> drupal (PHP-FPM) --SQL--> mysql (MariaDB)
#
# プロジェクト名を workspace に固定しているので、コンテナ名は
# CLAUDE.md に書かれている workspace-drupal-1 / workspace-mysql-1 のままになります。
name: workspace

services:
  # ---------------------------------------------------------------------------
  # データベース（MariaDB）
  # ---------------------------------------------------------------------------
  mysql:
    image: mariadb:11.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --transaction-isolation=READ-COMMITTED
      --max-allowed-packet=256M
    environment:
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-password}"
      MARIADB_DATABASE: "${DB_NAME:-drupal}"
      MARIADB_USER: "${DB_USER:-drupal}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-drupal}"
    volumes:
      - db_data:/var/lib/mysql
      # ./mysql/dump に .sql / .sql.gz を置くと初回起動時に流し込まれます。
      - ./mysql/dump:/docker-entrypoint-initdb.d:ro
    # DB のポートはホストに公開しません（他の MySQL とぶつかって起動に失敗するため）。
    # 中を見たいときは: docker exec workspace-drupal-1 drush sql:cli
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Drupal 本体（PHP-FPM + Drush）
  # ---------------------------------------------------------------------------
  drupal:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # コンテナ内の www-data をホストのユーザー ID に合わせる。
        # こうしないと bind mount した custom コードが root 所有になって編集できなくなります。
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"
    environment:
      DRUPAL_DB_HOST: mysql
      DRUPAL_DB_PORT: "3306"
      DRUPAL_DB_NAME: "${DB_NAME:-drupal}"
      DRUPAL_DB_USER: "${DB_USER:-drupal}"
      DRUPAL_DB_PASSWORD: "${DB_PASSWORD:-drupal}"
      # drush が生成する URL をブラウザで開けるものにする
      DRUSH_OPTIONS_URI: "${SITE_URL:-http://localhost:8080}"
      DRUPAL_SITE_NAME: "${SITE_NAME:-SO-ARM Knowledge Portal}"
      DRUPAL_ADMIN_USER: "${ADMIN_USER:-admin}"
      DRUPAL_ADMIN_PASS: "${ADMIN_PASS:-admin}"
      DRUPAL_HASH_SALT: "${DRUPAL_HASH_SALT:-}"
      DRUPAL_TRUSTED_HOSTS: "${TRUSTED_HOSTS:-^localhost$$,^127\\.0\\.0\\.1$$,^nginx$$}"
    volumes:
      # Drupal コア + vendor はイメージの中にあります（ボリュームにしない）。
      # 自分で書くコードだけをホストから bind mount する
      - ./web/modules/custom:/opt/drupal/web/modules/custom
      - ./web/themes/custom:/opt/drupal/web/themes/custom
      # 設定同期ディレクトリ（drush config:export の出力先）
      - ./config:/opt/drupal/config
      # アップロードファイル（動画・軌道データ・画像）
      - drupal_files:/opt/drupal/web/sites/default/files
      # 非公開ファイルと hash_salt
      - drupal_private:/opt/drupal/private
    depends_on:
      mysql:
        condition: service_healthy
    # 初回は Drupal のインストールが走るので、準備完了まで数分かかります。
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/soarm-ready && pgrep -x php-fpm >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 600s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Web サーバー（Nginx）
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    volumes:
      - ./web/modules/custom:/opt/drupal/web/modules/custom:ro
      - ./web/themes/custom:/opt/drupal/web/themes/custom:ro
      - drupal_files:/opt/drupal/web/sites/default/files:ro
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      drupal:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # S3 互換ストレージ（任意）: docker compose --profile s3 up -d で起動
  # 大容量の動画・軌道データを S3 互換ストレージに置く構成を試すためのものです。
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    profiles: ["s3"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:-soarmadmin}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:-soarmadmin}"
    volumes:
      - minio_data:/data
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    restart: unless-stopped

volumes:
  db_data: {}
  drupal_files: {}
  drupal_private: {}
  minio_data: {}
